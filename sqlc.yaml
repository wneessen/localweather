version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/database/migrations"
    queries: "internal/database/queries"
    gen:
      go:
        emit_json_tags: true
        package: "model"
        out: "internal/database/model"
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_prepared_queries: false
